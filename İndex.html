<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri - Summer Smith</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            display: block;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 28px;
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .bank-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bank-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .bank-name {
            font-weight: 600;
            font-size: 15px;
        }

        .iban-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .iban-number {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            word-break: break-all;
            color: #e2e8f0;
            margin-bottom: 16px;
        }

        .btn-copy {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-copy:hover {
            background: var(--accent-hover);
        }

        .btn-copy:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profil" class="profile-img">
        <h1 class="title">Summer Smith</h1>
        <p class="subtitle">Hızlı ve Güvenli Ödeme Sayfası</p>

        <!-- Garanti BBVA Card -->
        <div class="card">
            <div class="card-header">
                <div class="bank-info">
                    <div class="bank-icon">🏦</div>
                    <span class="bank-name">Garanti BBVA</span>
                </div>
            </div>
            <div class="iban-label">IBAN Numarası</div>
            <div class="iban-number" id="iban1">TR12 0006 2000 0000 1234 5678 90</div>
            <button class="btn-copy" onclick="copyIBAN('iban1', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                IBAN'ı Kopyala
            </button>
        </div>

        <!-- Ziraat Bankası Card -->
        <div class="card">
            <div class="card-header">
                <div class="bank-info">
                    <div class="bank-icon">🏛️</div>
                    <span class="bank-name">Ziraat Bankası</span>
                </div>
            </div>
            <div class="iban-label">IBAN Numarası</div>
            <div class="iban-number" id="iban2">TR98 0001 0000 0000 9876 5432 10</div>
            <button class="btn-copy" onclick="copyIBAN('iban2', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                IBAN'ı Kopyala
            </button>
        </div>

        <div class="footer">
            🔒 256-bit Güvenli Bağlantı
        </div>
    </div>

    <div class="toast" id="toast">IBAN Başarıyla Kopyalandı! 🎉</div>

    <script>
        function copyIBAN(id, btn) {
            const ibanText = document.getElementById(id).innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(ibanText).then(() => {
                showToast();
                triggerConfetti();
                
                const originalText = btn.innerHTML;
                btn.innerHTML = `✓ Kopyalandı!`;
                btn.style.background = '#059669';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'var(--accent-color)';
                }, 2000);
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#10b981', '#60a5fa', '#f59e0b']
            });
        }
    </script>
</body>
</html>
